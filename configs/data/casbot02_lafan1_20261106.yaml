# 2026-11-06 refreshed source data; independent cache namespace.
# CSV: root xyz (m), root quaternion xyzw, 27 MJCF-ordered joint angles (rad).
# Original LAFAN1 export rate: 30 Hz. MotionLib interpolates at the 50 Hz control rate.
robot_config: configs/robots/casbot02.yaml
datasets:
- name: lafan1_casbot02
  format: robot_state_csv
  source_path: data/lafan1_casbot02
  weight: 1.0
  fps: 30
  columns:
    dof_pos: xml_order
  auto_build:
    train_clip_seconds: 10.0
    clip_stride_seconds: 10.0
    keep_short: true
    min_clip_seconds: 1.0
